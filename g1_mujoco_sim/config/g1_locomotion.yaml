# ============================================================================
# G1 locomotion stack - single source of truth for every tunable number.
#
# The launch file loads this into the parameter server before either node
# starts, so the MPC (C++) and the simulation / whole-body ID (Python) read the
# *same* values.  Anything that has to agree between them - friction, gravity,
# gait timing, foot geometry - lives here exactly once.
#
# The `robot:` section is generated from the URDF; run
#   rosrun g1_mujoco_sim extract_robot_params.py
# after changing the model or the nominal configuration.
# ============================================================================

robot:
  # ---- generated by scripts/extract_robot_params.py, do not hand-edit ----
  mass: 34.133857
  # Centroidal composite inertia at the nominal configuration [kg m^2].
  inertia:
    - [3.20563946e+00, 4.35026688e-05, 4.25525811e-01]
    - [4.35026688e-05, 3.05015045e+00, -6.50820293e-04]
    - [4.25525811e-01, -6.50820293e-04, 5.52352536e-01]
  # CoM height above the soles at the nominal configuration [m].
  com_height: 0.623656
  # Pelvis height that puts the soles exactly on the ground [m].
  base_height: 0.675673
  # Heel/toe offsets along x in the foot frame [m].
  foot_heel_x: -0.050000
  foot_toe_x: 0.120000
  # Nominal lateral distance between the two feet [m].
  stance_width: 0.237013
  # Nominal foot position relative to the CoM, along x [m].
  foot_offset_x: -0.032023
  contact_frames:
    - left_foot_line_contact_lower
    - left_foot_line_contact_upper
    - right_foot_line_contact_lower
    - right_foot_line_contact_upper
  foot_frames:
    - left_foot_point_contact
    - right_foot_point_contact

# Shared physical constants.  Both the MPC friction pyramid and the whole-body
# friction cones use `friction_coefficient`; the MuJoCo geoms are set to the
# same value at load time so the plan and the plant agree on what the ground
# can do.
physics:
  gravity: -9.80665
  friction_coefficient: 0.8
  # Normal force limits per contact *point* [N].  fz_max is generous enough for
  # single support (one foot, two points, has to carry the whole robot).
  fz_min: 5.0
  fz_max: 500.0

simulation:
  timestep: 0.001
  # Whole-body inverse dynamics runs at every physics tick.
  # Real-time pacing; set false to run as fast as the machine allows.
  realtime: true
  # The base is considered fallen below this CoM height [m].
  fall_height: 0.35

gait:
  # A tick is one MPC step (mpc/dt).  Keeping the schedule on integer ticks is
  # what stops contact transitions from landing between two solves and leaving
  # a foot with stale forces for part of a tick.
  period_ticks: 24        # 0.96 s
  stance_ticks: 17        # 0.68 s per leg -> 0.40 s of double support per cycle
  # Left leg starts its stance at tick 0, right leg half a period later.
  right_offset_ticks: 12
  swing_height: 0.06
  # During single support the CoM reference leans towards the stance foot by
  # this fraction of the offset from the feet midpoint to the support centroid.
  # Without it the reference insists on staying between the feet and fights the
  # weight shift the step depends on. The crossover happens over the
  # double-support interval, which is what that interval is for.
  sway_gain: 0.6
  # A walk command must persist this long before the first step, so the robot
  # has time to shift its weight instead of lifting a foot while still centred.
  startup_delay: 1.0
  # Accept ground contact from this point in the swing onwards, even if the
  # schedule still says the foot is in the air. Feet routinely land early, and
  # continuing to drive one into ground it has already reached throws the robot.
  early_touchdown_phase: 0.6
  # Below this commanded speed the scheduler holds double support instead of
  # stepping in place.
  stand_still_velocity: 0.02
  stand_still_yaw_rate: 0.05

footstep:
  # Raibert heuristic. The velocity-feedback gain defaults to the capture-point
  # value sqrt(h/g) when `use_capture_point_gain` is true, which is the
  # physically meaningful choice; `velocity_gain` is then ignored.
  use_capture_point_gain: true
  velocity_gain: 0.10
  # Clamps, applied in the yaw-aligned body frame relative to the nominal hip
  # position, before the target is rotated back into the world.
  max_step_x: 0.25
  max_step_y: 0.12
  # The swing foot may never cross the stance foot: this is the minimum
  # lateral distance from the CoM line to a foot [m].
  min_lateral_offset: 0.09
  max_lateral_offset: 0.30
  # Cap on the correction the feedback term may add, so a velocity spike
  # cannot throw the foot away [m].
  max_feedback: 0.15

mpc:
  dt: 0.04
  horizon: 12
  # State weights: roll pitch yaw | x y z | wx wy wz | vx vy vz | gravity.
  #
  # Two ratios matter more than the absolute values. Roll and pitch are held
  # deliberately low: correcting body tilt costs horizontal contact force, so a
  # high attitude weight converts a small tilt into a large CoM acceleration and
  # the robot walks itself over. CoM velocity is weighted heavily because it is
  # the damping term that actually arrests a fall; with it too low the robot
  # drifts at close to the open-loop inverted-pendulum rate.
  # The last entry is the gravity augmentation and must stay at zero.
  # Horizontal position is weighted well below velocity: where the robot is
  # along its path matters much less than how fast it is going, and a large
  # standing position error otherwise pins the centre of pressure at the heel
  # for as long as the error lasts, which stalls the walk and tips it backwards.
  q_weights: [2.0e+2, 2.0e+2, 5.0e+2,
              3.0e+2, 3.0e+2, 3.0e+3,
              1.0e+1, 1.0e+1, 5.0e+1,
              5.0e+2, 5.0e+2, 4.0e+2,
              0.0]
  # Force regularisation, one entry per force component.
  r_weight: 1.0e-3
  # Reference position is integrated from the velocity command but is not
  # allowed to run away from the measurement by more than this [m] / [rad].
  max_position_error: 0.05
  max_yaw_error: 0.15
  osqp:
    max_iterations: 200
    absolute_tolerance: 1.0e-4
    relative_tolerance: 1.0e-4

command:
  # Body-frame velocity command; also settable live on /cmd_vel.
  default_linear_x: 0.0
  default_linear_y: 0.0
  default_angular_z: 0.0
  # Rate limits applied to whatever arrives on /cmd_vel [m/s^2], [rad/s^2].
  max_linear_acceleration: 0.25
  max_angular_acceleration: 1.0
  max_linear_velocity: 0.6
  max_angular_velocity: 0.6

wbid:
  # Task weights are chosen so each term contributes comparably *after* being
  # scaled by the size of its residual. Accelerations are order 1 m/s^2 while
  # contact forces are order 100 N, so a force-tracking weight anywhere near an
  # acceleration weight silently outvotes balance: the QP would rather keep the
  # planned force distribution than stop the robot from toppling.
  com:
    # Gains are bounded by what the support polygon can actually deliver. The
    # reachable CoM acceleration is about (g/h) times the distance from the CoM
    # to the edge of the feet, roughly 1.3 m/s^2 here, so a stiffness that
    # demands far more than that just saturates and distorts the whole stack.
    kp: [120.0, 120.0, 250.0]
    kd: [22.0, 22.0, 32.0]
    weight: 12.0
  base_orientation:
    # Deliberately softer than the CoM task: holding the pelvis rigidly level
    # blocks the ankle strategy the robot needs to keep its balance.
    kp: [50.0, 50.0, 50.0]
    kd: [15.0, 15.0, 15.0]
    weight: 2.0
  stance_foot:
    # A planted foot needs holding, not clamping. Very stiff gains here ask for
    # more torque than the hips and ankles can deliver, and once the QP is
    # saturating it is no longer tracking anything it was asked to.
    kp: [800.0, 800.0, 800.0, 200.0, 200.0, 200.0]
    kd: [56.0, 56.0, 56.0, 28.0, 28.0, 28.0]
    weight: 15.0
  swing_foot:
    kp: [900.0, 900.0, 900.0, 150.0, 150.0, 150.0]
    kd: [60.0, 60.0, 60.0, 24.0, 24.0, 24.0]
    weight: 8.0
  posture:
    kp: 200.0
    kd: 28.0
    weight: 0.4
  angular_momentum:
    kd: 3.0
    weight: 0.5
  # Follow the MPC's force split where it does not cost balance. Forces are two
  # orders of magnitude larger than accelerations, hence the small weight.
  force_tracking_weight: 1.0e-3
  acceleration_regularisation: 1.0e-3
  torque_regularisation: 1.0e-6
